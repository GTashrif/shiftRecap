<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Gazi Nadvi — Work Roster</title><style>:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 14px 50px}header{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:20px;padding:25px 20px;margin-bottom:14px}header small{color:#fbbf24;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:6px 0;font-size:clamp(30px,7vw,46px)}header p{margin:0;color:#d1d5db}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:11px}.shift{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;display:flex;align-items:center;gap:12px}.shift.today{border:2px solid var(--accent);background:#fffbeb}.date{min-width:82px}.date b{display:block}.date small{color:var(--muted)}.details{flex:1}.time{font-weight:800}.role{color:var(--muted);font-size:13px;margin-top:2px}.badge{font-size:10px;font-weight:800;text-transform:uppercase;background:#f3f4f6;padding:5px 7px;border-radius:999px}.today .badge{background:#fef3c7;color:#92400e}.done .badge{background:#dcfce7;color:#166534}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 9px}.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px}.empty{background:#fff;border:1px dashed #d1d5db;border-radius:14px;padding:20px;text-align:center;color:var(--muted)}footer{text-align:center;color:#9ca3af;font-size:11px;margin-top:25px}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.badge{display:none}.shift{align-items:flex-start}.date{min-width:72px}.time{font-size:14px}}</style></head><body><main class="wrap"><header><small>McDonald's · Managers Roster</small><h1>Gazi Nadvi</h1><p id="period"></p></header><select id="month" class="select"></select><div class="stats"><div class="stat"><b id="count">0</b><span>rostered shifts</span></div><div class="stat"><b id="hours">0h</b><span>rostered hours</span></div><div class="stat"><b id="next">—</b><span>next shift</span></div></div><section class="section"><h2>Upcoming & current</h2><div id="upcoming"></div></section><section class="section"><h2>All shifts</h2><div id="all"></div></section><footer>Send me your next roster and I can update this roster data while keeping previous months.</footer></main><script>const rosters={"2026-10":{label:"October 2026",period:"05 October 2026 – 01 November 2026",shifts:[["2026-10-07","Wednesday","08:00 AM","06:00 PM","LTF"],["2026-10-09","Friday","02:00 PM","10:00 PM","Close"],["2026-10-14","Wednesday","04:00 AM","06:00 PM","OP TRAN"],["2026-10-16","Friday","02:00 PM","10:00 PM","Close"],["2026-10-18","Sunday","02:00 PM","10:00 PM","Close"],["2026-10-21","Wednesday","02:00 PM","10:00 PM","Close"],["2026-10-22","Thursday","02:00 PM","10:00 PM","Close"],["2026-10-26","Monday","08:00 AM","04:00 PM","LT & AYL"],["2026-10-27","Tuesday","08:00 AM","04:00 PM","LT & AYL"],["2026-10-28","Wednesday","08:00 AM","04:00 PM","LT & AYL"],["2026-10-29","Thursday","08:00 AM","04:00 PM","LT & AYL"]]}};const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});function mins(t){let a=t.match(/(\d+):(\d+) (AM|PM)/),h=+a[1],m=+a[2];if(a[3]=='PM'&&h<12)h+=12;if(a[3]=='AM'&&h==12)h=0;return h*60+m}function dur(s){return (mins(s[3])-mins(s[2]))/60}function card(s){let d=new Date(s[0]+'T12:00:00'),is=s[0]===today(),past=s[0]<today();return `<div class="shift ${is?'today':''} ${past?'done':''}"><div class="date"><b>${d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</b><small>${s[1]}</small></div><div class="details"><div class="time">${s[2]} – ${s[3]}</div><div class="role">${s[4]}</div></div><span class="badge">${is?'Today':past?'Completed':'Upcoming'}</span></div>`}function render(){let r=rosters[$('month').value],s=r.shifts,total=s.reduce((a,x)=>a+dur(x),0),n=s.find(x=>x[0]>=today());$('period').textContent=r.period;$('count').textContent=s.length;$('hours').textContent=total+'h';$('next').textContent=n?new Date(n[0]+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'—';$('all').innerHTML=s.map(card).join('');let u=s.filter(x=>x[0]>=today());$('upcoming').innerHTML=u.length?u.map(card).join(''):'<div class="empty">No upcoming shifts.</div>'}Object.entries(rosters).forEach(([k,r])=>{let o=document.createElement('option');o.value=k;o.textContent=r.label;$('month').appendChild(o)});$('month').value='2026-10';$('month').onchange=render;render();</script></body></html>
