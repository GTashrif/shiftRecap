<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Recap</title>
<style>
  :root{
    --blue:#7696DB;
    --purple:#562D7D;
    --magenta:#AE427B;
    --coral:#FF8A98;
    --panel:#FFFFFF;
    --ink:#2a1c38;
    --ink-soft:#5c4d6b;
    --ok:#562D7D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--magenta) 0%, transparent 60%),
      linear-gradient(160deg, var(--purple) 0%, var(--blue) 100%);
    background-attachment:fixed;
    font-family:'Courier New', ui-monospace, monospace;
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  .eyebrow{
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--coral);
    margin-bottom:10px;
  }
  h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:clamp(28px,4vw,44px);
    margin:0;
    color:#FFFFFF;
    letter-spacing:.02em;
  }
  h1 span{color:var(--coral);}
  .sub{
    color:#e6d9ee;
    font-size:13px;
    margin-top:8px;
  }
  .layout{
    display:grid;
    grid-template-columns:1.15fr 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--blue);
    border-radius:8px;
    padding:26px;
    box-shadow:0 8px 24px rgba(35,15,55,.3);
  }
  .section-title{
    font-family:Georgia, serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:var(--magenta);
    margin:0 0 16px;
    padding-bottom:8px;
    border-bottom:1px dashed var(--blue);
  }
  .section-title:not(:first-child){margin-top:26px;}
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    line-height:1.4;
  }
  .field label .emoji{margin-right:2px;}
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="date"],
  .field textarea,
  .field select{
    width:100%;
    background:#F7F2FA;
    color:var(--ink);
    border:1px solid var(--blue);
    border-radius:5px;
    padding:9px 10px;
    font-family:'Courier New', monospace;
    font-size:13.5px;
    resize:vertical;
  }
  .field textarea{min-height:56px;}
  .field input:focus,
  .field textarea:focus,
  .field select:focus{
    outline:2px solid var(--coral);
    outline-offset:1px;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}
  .toggle-group{
    display:flex;
    gap:8px;
  }
  .toggle-group button{
    flex:1;
    padding:10px;
    background:#F7F2FA;
    border:1px solid var(--blue);
    border-radius:5px;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.05em;
  }
  .toggle-group button.active{
    background:var(--magenta);
    color:#fff;
    border-color:var(--magenta);
    font-weight:bold;
  }
  .check-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:#F7F2FA;
    border:1px solid var(--blue);
    border-radius:5px;
    padding:9px 10px;
  }
  .check-row input[type="checkbox"]{
    width:18px;height:18px;accent-color:var(--magenta);cursor:pointer;
  }
  .check-row label{margin:0;color:var(--ink);font-size:13px;cursor:pointer;}

  /* Receipt preview */
  .receipt-outer{
    position:sticky;
    top:20px;
    background:var(--purple);
    border:1px solid var(--magenta);
    border-radius:8px;
    padding:18px;
  }
  .receipt-label{
    font-family:Georgia,serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:var(--coral);
    margin-bottom:12px;
  }
  .receipt{
    background:#F7F2FA;
    color:var(--ink);
    padding:22px 20px;
    border-radius:4px;
    box-shadow:0 10px 30px rgba(20,10,35,.4);
    font-size:12.6px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'Courier New', monospace;
    min-height:200px;
    background-image:repeating-linear-gradient(#F7F2FA 0px, #F7F2FA 23px, #ecdff2 24px);
    position:relative;
  }
  .receipt::before,.receipt::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:10px;
    background:
      radial-gradient(circle at 6px 5px, var(--purple) 5px, transparent 5.5px) repeat-x;
    background-size:16px 10px;
  }
  .receipt::before{top:-6px;}
  .receipt::after{bottom:-6px;transform:scaleY(-1);}

  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width:140px;
    padding:13px 16px;
    border-radius:5px;
    border:none;
    font-family:inherit;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    font-weight:bold;
  }
  .btn-primary{background:var(--coral);color:#3a0f1c;}
  .btn-primary:hover{background:#ff6f80;}
  .btn-secondary{background:var(--blue);color:#1c2233;}
  .btn-secondary:hover{background:#5c80cf;}
  .status{
    margin-top:10px;
    font-size:12px;
    color:var(--coral);
    min-height:16px;
    font-weight:bold;
  }
  .recipient{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--blue);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">End of Shift</div>
    <h1>Shift <span>Recap</span> Ticket</h1>
    <div class="sub">Fill it in, it prints itself into the exact copy-paste format below.</div>
  </header>

  <div class="layout">
    <!-- FORM -->
    <div class="panel">
      <div class="section-title">Shift &amp; Sales</div>

      <div class="field">
        <label>Shift type</label>
        <div class="toggle-group" id="shiftToggle">
          <button type="button" data-val="CLOSE" class="active">CLOSE</button>
          <button type="button" data-val="OPEN">OPEN</button>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label><span class="emoji">💰</span>Sales ($)</label>
          <input type="text" inputmode="decimal" id="sales" class="numeric-input" placeholder="25,484.26">
        </div>
        <div class="field">
          <label><span class="emoji">🧑‍🍳</span>SPCH</label>
          <input type="text" inputmode="decimal" id="spch" class="numeric-input" placeholder="156.62">
        </div>
      </div>

      <div class="field">
        <label><span class="emoji">💹</span>Cash / Skims</label>
        <input type="text" id="cash" placeholder="safe balanced, cash down $51">
      </div>

      <div class="row2">
        <div class="field">
          <label><span class="emoji">🛃</span>Labour</label>
          <input type="text" id="labour" placeholder="162.72 (down 1.28)">
        </div>
        <div class="field">
          <label><span class="emoji">⏱</span>MFY time on KVS</label>
          <input type="text" inputmode="numeric" id="mfy" class="numeric-input" placeholder="35">
        </div>
      </div>

      <div class="field">
        <label><span class="emoji">🗑</span>Waste (WTD)</label>
        <input type="text" inputmode="decimal" id="waste" class="numeric-input" placeholder=".51">
      </div>

      <div class="section-title">Notes</div>

      <div class="field">
        <label><span class="emoji">❌</span>Issues</label>
        <textarea id="issues" placeholder="none">none</textarea>
      </div>

      <div class="field">
        <label><span class="emoji">✅</span>Highlights</label>
        <textarea id="highlights" placeholder="crew were really good"></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label><span class="emoji">🥸</span>FRED</label>
          <input type="text" id="fred" placeholder="done">
        </div>
        <div class="field">
          <label><span class="emoji">↔️</span>Transfers</label>
          <input type="text" id="transfers" placeholder="none">
        </div>
      </div>

      <div class="field">
        <label><span class="emoji">🤧</span>Sick call / Shift changes</label>
        <input type="text" id="sick" placeholder="Ayesha and Anastacia swapped tomorrow">
      </div>

      <div class="field">
        <label><span class="emoji">⚠️</span>Hazard / Incident log</label>
        <input type="text" id="hazard" placeholder="none">
      </div>

      <div class="row2">
        <div class="field">
          <label><span class="emoji">🍴</span>Manager meal</label>
          <input type="text" id="mgrmeal" placeholder="entered">
        </div>
        <div class="field">
          <label><span class="emoji">💸</span>Refunds</label>
          <input type="text" id="refunds" placeholder="none">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label><span class="emoji">🔄</span>Rotations</label>
          <input type="text" id="rotations" placeholder="checked">
        </div>
        <div class="field">
          <label><span class="emoji">🛑</span>Outages</label>
          <input type="text" id="outages" placeholder="cold foam">
        </div>
      </div>

      <div class="field">
        <label><span class="emoji">⛓️‍💥</span>Equipment breakdown</label>
        <input type="text" id="equipment" placeholder="ABS drain is clogged, tried unclogging but wasn't working">
      </div>

      <div class="field">
        <label><span class="emoji">🗑️</span>Bin &amp; cardboard run</label>
        <input type="text" id="bin" placeholder="bin run done">
      </div>

      <div class="section-title">Product Prep</div>

      <div class="row2">
        <div class="field">
          <div class="check-row">
            <input type="checkbox" id="prepBA" checked>
            <label for="prepBA"><span class="emoji">🍔</span>Product prep BA</label>
          </div>
        </div>
        <div class="field">
          <div class="check-row">
            <input type="checkbox" id="prepCafe" checked>
            <label for="prepCafe"><span class="emoji">☕️</span>Product prep cafe</label>
          </div>
        </div>
      </div>
    </div>

    <!-- RECEIPT PREVIEW / SEND -->
    <div>
      <div class="receipt-outer">
        <div class="receipt-label">Live preview</div>
        <div class="receipt" id="receiptText"></div>

        <div class="recipient">
          <div class="field" style="margin-bottom:0;">
            <label>Send to (email)</label>
            <input type="email" id="recipient" placeholder="manager@store.com">
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="sendBtn">Send email</button>
          <button class="btn btn-secondary" id="copyBtn">Copy text</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
</div>

<script>
function val(id){ return document.getElementById(id).value.trim(); }

let shiftType = 'CLOSE';
const toggleBtns = document.querySelectorAll('#shiftToggle button');
toggleBtns.forEach(b=>{
  b.addEventListener('click', ()=>{
    toggleBtns.forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    shiftType = b.dataset.val;
    render();
  });
});

function buildText(){
  const sales = val('sales') || '';
  const spch = val('spch') || '';
  const cash = val('cash') || '';
  const labour = val('labour') || '';
  const mfy = val('mfy') || '';
  const waste = val('waste') || '';
  const issues = val('issues') || 'none';
  const highlights = val('highlights') || 'none';
  const fred = val('fred') || '';
  const transfers = val('transfers') || 'none';
  const sick = val('sick') || 'none';
  const hazard = val('hazard') || 'none';
  const mgrmeal = val('mgrmeal') || '';
  const refunds = val('refunds') || 'none';
  const rotations = val('rotations') || '';
  const outages = val('outages') || 'none';
  const equipment = val('equipment') || 'none';
  const bin = val('bin') || '';
  const prepBA = document.getElementById('prepBA').checked ? '✅' : '❌';
  const prepCafe = document.getElementById('prepCafe').checked ? '✅' : '❌';

  return `⭐️RECAP⭐️ ${shiftType} SHIFT 🏁
💰SALES: $${sales}
🧑‍🍳SPCH : ${spch}
💹CASH/SKIMS: $${cash}
🛃Labour: $${labour}
⏱MFY time on KVS: ${mfy}
🗑WASTE: ${waste}${waste ? ' WTD' : ''}
❌ISSUES: 
- ${issues}
✅Highlights: 
- ${highlights}
🥸FRED: ${fred}
 ↔️Transfers: ${transfers}
 🤧Sick call / Shift Changes: ${sick}
⚠️Hazard/Incident Log - ${hazard}
🍴Manager meal - ${mgrmeal}
💸Refunds - ${refunds}
🔄Rotations - ${rotations}
🛑Outages - ${outages}
⛓️‍💥Equipment breakdown - ${equipment}
🗑️Bin & Cardboard run - ${bin}
🍔PRODUCT PREP BA: ${prepBA}
☕️PRODUCT PREP CAFE: ${prepCafe}`;
}

function render(){
  document.getElementById('receiptText').textContent = buildText();
}

document.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(el=>{
  el.addEventListener('input', render);
});

// Numeric-only enforcement: digits, one decimal point, optional leading minus, commas allowed (thousands)
document.querySelectorAll('.numeric-input').forEach(el=>{
  el.addEventListener('input', ()=>{
    const start = el.selectionStart;
    const before = el.value;
    let cleaned = before.replace(/[^0-9.,-]/g, '');
    // only one leading minus
    cleaned = cleaned.replace(/(?!^)-/g, '');
    // only one decimal point
    const firstDot = cleaned.indexOf('.');
    if(firstDot !== -1){
      cleaned = cleaned.slice(0, firstDot+1) + cleaned.slice(firstDot+1).replace(/\./g, '');
    }
    if(cleaned !== before){
      const diff = before.length - cleaned.length;
      el.value = cleaned;
      const pos = Math.max(0, start - diff);
      el.setSelectionRange(pos, pos);
    }
    render();
  });
});
document.getElementById('prepBA').addEventListener('change', render);
document.getElementById('prepCafe').addEventListener('change', render);

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const text = buildText();
  try{
    await navigator.clipboard.writeText(text);
    setStatus('Copied to clipboard.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    setStatus('Copied to clipboard.');
  }
});

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const recipient = val('recipient');
  if(!recipient){
    setStatus('Add a recipient email first.');
    document.getElementById('recipient').focus();
    return;
  }
  const text = buildText();
  const subject = encodeURIComponent(`Shift Recap - [${shiftType}] - ${new Date().toLocaleDateString()}`);
  const body = encodeURIComponent(text);
  window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${subject}&body=${body}`;
  setStatus('Opening your email app with the recap pre-filled…');
});

function setStatus(msg){
  const s = document.getElementById('status');
  s.textContent = msg;
  setTimeout(()=>{ if(s.textContent===msg) s.textContent=''; }, 4000);
}

render();
</script>
</body>
</html>
