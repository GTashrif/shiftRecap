<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#562D7D">
<title>Gazi Nadvi — Work Hub</title>
<style>
:root{--purple:#562D7D;--blue:#7696DB;--magenta:#AE427B;--coral:#FF8A98;--bg:#f5f3f8;--card:#fff;--ink:#24182f;--muted:#6b6075;--line:#e4ddea;--green:#166534}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f5f3f8,#eef2ff);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px 14px 60px}
header{background:linear-gradient(135deg,var(--purple),#7696DB);color:#fff;border-radius:22px;padding:25px 20px;margin-bottom:14px;box-shadow:0 10px 30px #39205033}header small{color:#ffd3da;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:5px 0;font-size:clamp(30px,7vw,46px)}header p{margin:0;color:#eee6f4}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.nav button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.nav button.active{background:var(--magenta);color:#fff;border-color:var(--magenta)}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #39205012}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:11px}.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 9px}.shift{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;display:flex;align-items:center;gap:12px}.shift.today{border:2px solid #f59e0b;background:#fffbeb}.shift.done{opacity:.72}.date{min-width:82px}.date b{display:block}.date small{color:var(--muted)}.details{flex:1}.time{font-weight:800}.role{color:var(--muted);font-size:13px;margin-top:2px}.badge{font-size:10px;font-weight:800;text-transform:uppercase;background:#f3f4f6;padding:5px 7px;border-radius:999px}.today .badge{background:#fef3c7;color:#92400e}.done .badge{background:#dcfce7;color:#166534}.empty{text-align:center;color:var(--muted);padding:20px;border:1px dashed #d1d5db;border-radius:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;background:#faf8fc;color:var(--ink);border:1px solid var(--blue);border-radius:7px;padding:10px;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.field textarea{min-height:65px;resize:vertical}.toggle{display:flex;gap:8px}.toggle button{flex:1;padding:10px;border:1px solid var(--blue);background:#faf8fc;border-radius:7px;cursor:pointer}.toggle button.active{background:var(--magenta);color:#fff;border-color:var(--magenta);font-weight:800}.title{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.16em;color:var(--magenta);font-size:13px;border-bottom:1px dashed var(--blue);padding-bottom:8px;margin:4px 0 16px}.receipt{background:#faf8fc;border-radius:10px;padding:18px;white-space:pre-wrap;line-height:1.65;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;min-height:260px;border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.btn{flex:1;min-width:140px;border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}.primary{background:var(--coral);color:#3a0f1c}.secondary{background:var(--blue);color:#17213b}.status{font-size:12px;color:var(--magenta);font-weight:700;margin-top:8px;min-height:16px}footer{text-align:center;color:#9ca3af;font-size:11px;margin-top:24px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.badge{display:none}.shift{align-items:flex-start}.date{min-width:72px}}
</style>
</head>
<body><main class="wrap">
<header><small>McDonald's · Personal Work Hub</small><h1>Gazi Nadvi</h1><p>Roster &amp; shift recap in one place.</p></header>
<nav class="nav"><button id="rosterTab" class="active" onclick="showView('roster')">📅 Work Roster</button><button id="recapTab" onclick="showView('recap')">🧾 Shift Recap</button></nav>
<section id="roster" class="view active">
<div class="card"><select id="month" class="select"></select><div class="stats"><div class="stat"><b id="count">0</b><span>rostered shifts</span></div><div class="stat"><b id="hours">0h</b><span>rostered hours</span></div><div class="stat"><b id="next">—</b><span>next shift</span></div></div></div>
<section class="section"><h2 id="period"></h2><div id="upcoming"></div></section>
<section class="section"><h2>All shifts</h2><div id="all"></div></section>
</section>
<section id="recap" class="view">
<div class="card"><div class="title">Shift &amp; Sales</div>
<div class="field"><label>Shift type</label><div class="toggle" id="shiftToggle"><button class="active" data-val="CLOSE">CLOSE</button><button data-val="OPEN">OPEN</button></div></div>
<div class="formgrid">
<div class="field"><label>💰 Sales ($)</label><input id="sales" placeholder="25,484.26"></div><div class="field"><label>🧑‍🍳 SPCH</label><input id="spch" placeholder="156.62"></div>
<div class="field full"><label>💹 Cash / Skims</label><input id="cash" placeholder="safe balanced, cash down $51"></div>
<div class="field"><label>🛃 Labour</label><input id="labour" placeholder="162.72 (down 1.28)"></div><div class="field"><label>⏱ MFY time on KVS</label><input id="mfy" placeholder="35"></div>
<div class="field full"><label>🗑 Waste (WTD)</label><input id="waste" placeholder=".51"></div></div>
<div class="title">Notes</div><div class="formgrid">
<div class="field"><label>❌ Issues</label><textarea id="issues">none</textarea></div><div class="field"><label>✅ Highlights</label><textarea id="highlights"></textarea></div>
<div class="field"><label>🥸 FRED</label><input id="fred" placeholder="done"></div><div class="field"><label>↔️ Transfers</label><input id="transfers" placeholder="none"></div>
<div class="field full"><label>🤧 Sick call / Shift changes</label><input id="sick" placeholder="none"></div>
<div class="field"><label>⚠️ Hazard / Incident log</label><input id="hazard" placeholder="none"></div><div class="field"><label>🍴 Manager meal</label><input id="mgrmeal" placeholder="entered"></div>
<div class="field"><label>💸 Refunds</label><input id="refunds" placeholder="none"></div><div class="field"><label>🔄 Rotations</label><input id="rotations" placeholder="checked"></div>
<div class="field"><label>🛑 Outages</label><input id="outages" placeholder="none"></div><div class="field"><label>⛓️‍💥 Equipment breakdown</label><input id="equipment" placeholder="none"></div>
<div class="field full"><label>🗑️ Bin &amp; cardboard run</label><input id="bin" placeholder="bin run done"></div></div>
<div class="title">Product Prep</div><div class="formgrid"><div class="field"><label>🍔 Product prep BA</label><input id="prepBA" placeholder="done"></div><div class="field"><label>☕ Product prep cafe</label><input id="prepCafe" placeholder="done"></div></div></div>
<div class="card"><div class="title">Live Preview</div><div class="receipt" id="receiptText"></div><div class="field" style="margin-top:14px"><label>Send to (email)</label><input type="email" id="recipient" placeholder="manager@store.com"></div><div class="actions"><button class="btn primary" id="sendBtn">Send email</button><button class="btn secondary" id="copyBtn">Copy text</button></div><div class="status" id="status"></div></div>
</section><footer>Send me your next roster and I can update the roster data while keeping previous months.</footer></main>
<script>
const rosters={"2026-10":{label:"October 2026",period:"05 October 2026 – 01 November 2026",shifts:[["2026-10-07","Wednesday","08:00 AM","06:00 PM","LTF"],["2026-10-09","Friday","02:00 PM","10:00 PM","Close"],["2026-10-14","Wednesday","04:00 AM","06:00 PM","OP TRAN"],["2026-10-16","Friday","02:00 PM","10:00 PM","Close"],["2026-10-18","Sunday","02:00 PM","10:00 PM","Close"],["2026-10-21","Wednesday","02:00 PM","10:00 PM","Close"],["2026-10-22","Thursday","02:00 PM","10:00 PM","Close"],["2026-10-26","Monday","08:00 AM","04:00 PM","LT & AYL"],["2026-10-27","Tuesday","08:00 AM","04:00 PM","LT & AYL"],["2026-10-28","Wednesday","08:00 AM","04:00 PM","LT & AYL"],["2026-10-29","Thursday","08:00 AM","04:00 PM","LT & AYL"]]}};
const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});function mins(t){let a=t.match(/(\d+):(\d+) (AM|PM)/),h=+a[1],m=+a[2];if(a[3]=='PM'&&h<12)h+=12;if(a[3]=='AM'&&h==12)h=0;return h*60+m}function dur(s){let d=mins(s[3])-mins(s[2]);return d<0?d+1440:d}function card(s){let d=new Date(s[0]+'T12:00:00'),is=s[0]===today(),past=s[0]<today();return `<div class="shift ${is?'today':''} ${past?'done':''}"><div class="date"><b>${d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</b><small>${s[1]}</small></div><div class="details"><div class="time">${s[2]} – ${s[3]}</div><div class="role">${s[4]}</div></div><span class="badge">${is?'Today':past?'Completed':'Upcoming'}</span></div>`}function renderRoster(){let r=rosters[$('month').value],s=r.shifts,total=s.reduce((a,x)=>a+dur(x),0)/60,n=s.find(x=>x[0]>=today());$('period').textContent=r.period;$('count').textContent=s.length;$('hours').textContent=Number.isInteger(total)?total+'h':total.toFixed(1)+'h';$('next').textContent=n?new Date(n[0]+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'—';$('all').innerHTML=s.map(card).join('');let u=s.filter(x=>x[0]>=today());$('upcoming').innerHTML=u.length?u.map(card).join(''):'<div class="empty">No upcoming shifts.</div>'}Object.entries(rosters).forEach(([k,r])=>{let o=document.createElement('option');o.value=k;o.textContent=r.label;$('month').appendChild(o)});$('month').value='2026-10';$('month').onchange=renderRoster;
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');$(v==='roster'?'rosterTab':'recapTab').classList.add('active')}
let shiftType='CLOSE';document.querySelectorAll('#shiftToggle button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#shiftToggle button').forEach(x=>x.classList.remove('active'));b.classList.add('active');shiftType=b.dataset.val;renderRecap()});function v(id,f=''){return ($(id).value||'').trim()||f}
function buildText(){return `🧾 SHIFT RECAP — ${shiftType}\n\n💰 SALES: $${v('sales','')}\n🧑‍🍳 SPCH: ${v('spch','')}\n💹 CASH / SKIMS: ${v('cash','')}\n🛃 LABOUR: ${v('labour','')}\n⏱ MFY TIME ON KVS: ${v('mfy','')}\n🗑 WASTE (WTD): ${v('waste','')}\n\n❌ ISSUES: ${v('issues','none')}\n✅ HIGHLIGHTS: ${v('highlights','none')}\n🥸 FRED: ${v('fred','')}\n↔️ TRANSFERS: ${v('transfers','none')}\n🤧 SICK CALL / SHIFT CHANGES: ${v('sick','none')}\n⚠️ HAZARD / INCIDENT LOG: ${v('hazard','none')}\n🍴 MANAGER MEAL: ${v('mgrmeal','')}\n💸 REFUNDS: ${v('refunds','none')}\n🔄 ROTATIONS: ${v('rotations','')}\n🛑 OUTAGES: ${v('outages','')}\n⛓️‍💥 EQUIPMENT BREAKDOWN: ${v('equipment','')}\n🗑️ BIN & CARDBOARD RUN: ${v('bin','')}\n\n🍔 PRODUCT PREP BA: ${v('prepBA','')}\n☕ PRODUCT PREP CAFE: ${v('prepCafe','')}`}
function renderRecap(){$('receiptText').textContent=buildText();localStorage.setItem('gaziShiftRecap',JSON.stringify(Object.fromEntries([...document.querySelectorAll('#recap input,#recap textarea')].map(x=>[x.id,x.value]))))}
document.querySelectorAll('#recap input,#recap textarea').forEach(x=>x.addEventListener('input',renderRecap));$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(buildText());$('status').textContent='Copied.';setTimeout(()=>$('status').textContent='',1500)};$('sendBtn').onclick=()=>{let to=v('recipient');if(!to){$('status').textContent='Enter an email address first.';return}location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('Shift Recap — '+shiftType)+'&body='+encodeURIComponent(buildText())};try{let saved=JSON.parse(localStorage.getItem('gaziShiftRecap')||'{}');Object.entries(saved).forEach(([id,val])=>{if($(id))$(id).value=val})}catch(e){}renderRoster();renderRecap();
</script></body></html>
